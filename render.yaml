services:
  # ── Backend FastAPI Web Service ─────────────────────────────────────────────
  - type: web
    name: quizchat-backend
    env: python
    region: oregon
    plan: free
    rootDir: server
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false # Set via Render Dashboard to your MongoDB Atlas connection string
      - key: MONGO_DB_NAME
        value: quizchat
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: FRONTEND_ORIGIN
        sync: false # e.g. https://quizchat.vercel.app,http://localhost:5173

  # ── Frontend Static Site ───────────────────────────────────────────────────
  - type: static
    name: quizchat-frontend
    env: static
    region: oregon
    plan: free
    rootDir: client
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # e.g. https://quizchat-backend.onrender.com
