version: "3.9"

services:
  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: quizchat_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: quizchat
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── FastAPI backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: quizchat_backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    volumes:
      # Mount source for local hot-reload during development.
      # Remove this volume in a production image build.
      - ./server:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Vite + React frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: quizchat_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    env_file:
      - ./client/.env
    volumes:
      # Mount source for local hot-reload during development.
      - ./client:/app
      # Prevent host node_modules from shadowing the container's.
      - /app/node_modules
    command: npm run dev -- --host

  # ── One-off seed service ──────────────────────────────────────────────────────
  # Usage: docker-compose run --rm seed
  seed:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: quizchat_seed
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - ./server/.env
    command: python -m app.scripts.seed_data --force
    profiles:
      - seed

volumes:
  mongo_data:
    driver: local
